<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,"><meta name="robots" content="noindex,nofollow"><title>Mack Living | Contract pipeline</title>
<style>
:root{--acc:#1f4e79;--navy:#0f1f33;--ink:#1e293b;--mut:#64748b;--line:#e2e8f0;--bg:#f8fafc}
*{box-sizing:border-box}body{margin:0;font:13px/1.45 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--ink);background:var(--bg)}
header{display:flex;align-items:center;gap:24px;padding:0 24px;height:52px;background:var(--navy);color:#fff}
header h1{font-size:15px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap}header h1 span{color:#94a3b8;font-weight:400}
#tabs{display:flex;height:100%}#tabs button{background:none;border:0;border-bottom:2px solid transparent;color:#cbd5e1;padding:0 14px;cursor:pointer;font:500 13px inherit;font-family:inherit}
#tabs button:hover{color:#fff}#tabs button.on{color:#fff;border-bottom-color:#fff}.sp{flex:1}#built{color:#94a3b8;font-size:12px}
#xl{border:1px solid #475569;color:#fff;text-decoration:none;padding:5px 12px;border-radius:4px;font-size:12px;font-weight:500}#xl:hover{background:#1e3a5f}
main{padding:16px 24px 80px;max-width:1800px;margin:0 auto}section{background:#fff;border:1px solid var(--line);border-radius:4px;margin:0 0 16px}
.sh{display:flex;align-items:center;gap:12px;padding:10px 14px;border-bottom:1px solid var(--line)}.sh h2{font-size:13px;font-weight:600;margin:0;flex:1;text-transform:uppercase;letter-spacing:.04em;color:var(--navy)}.sh h2 .mu{text-transform:none;letter-spacing:0;font-weight:400}
.q{padding:5px 9px;font:inherit;width:220px;border:1px solid var(--line);border-radius:4px}.q:focus,.wts input:focus{outline:1px solid var(--acc)}
.sc{overflow:auto;max-height:72vh}table{border-collapse:collapse;width:100%}th,td{border-bottom:1px solid #f1f5f9;padding:6px 10px;text-align:left;vertical-align:top;font-size:12px;max-width:340px;overflow-wrap:anywhere}
th{background:#f1f5f9;color:#475569;font-weight:600;font-size:11px;text-transform:uppercase;letter-spacing:.03em;position:sticky;top:0;z-index:1;white-space:nowrap;border-bottom:1px solid var(--line)}
tbody tr:hover td{background:#f8fafc}.idc{white-space:nowrap;font-weight:600;color:var(--navy)}.mu{color:#94a3b8}
.pill{display:inline-block;border:1px solid;border-radius:3px;padding:0 6px;font-size:11px;font-weight:500;white-space:nowrap;line-height:18px}
.ln{color:var(--acc);text-decoration:none;white-space:nowrap;border-bottom:1px dotted #94a3b8}.ln:hover{border-bottom-color:var(--acc)}
tr.hl td,tr.ask-hl td{background:#eef3f9!important}tr.ask-hl{outline:1px solid var(--acc)!important}
.wts{display:flex;gap:14px;align-items:center;padding:8px 14px;border-bottom:1px solid var(--line);color:var(--mut);font-size:12px}.wts input{width:52px;padding:2px 4px;border:1px solid var(--line);border-radius:3px;font:inherit}
.wts button{border:1px solid var(--line);background:#fff;border-radius:3px;padding:2px 10px;cursor:pointer;font:inherit}
#ask-fab{border-radius:4px!important;box-shadow:0 2px 8px rgba(15,31,51,.2)!important;font:500 13px Inter,system-ui,sans-serif!important;padding:9px 16px!important}
#ask-pane{border-radius:6px!important;font-family:Inter,system-ui,sans-serif!important;box-shadow:0 8px 24px rgba(15,31,51,.18)!important}#ask-hd{background:var(--navy);color:#fff;border-radius:6px 6px 0 0}#ask-hd button{color:#cbd5e1!important}
.ask-m{border-radius:4px!important;font-size:13px}.ask-sug button,#ask-f textarea,#ask-f button{border-radius:4px!important}
</style></head><body>
<header><h1>Mack Living <span>|</span> Contract pipeline</h1><nav id="tabs"></nav><span class="sp"></span><span id="built"></span><a id="xl" href="Mack_Living_Pipeline.xlsx">Download Excel</a></header>
<main id="main">Loading</main>
<script src="mack-pipeline-model.js"></script><script src="app.js"></script><script src="ask-pipeline.js?v=2" defer></script>
</body></html>
